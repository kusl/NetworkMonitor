name: Dependency Check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Restore
        continue-on-error: true
        run: dotnet restore src/NetworkMonitor.slnx

      - name: Report
        continue-on-error: true
        shell: bash
        run: |
          report() {
            echo "## $1"
            echo ""
            echo '```'
            dotnet package list --project src/NetworkMonitor.slnx --include-transitive "${@:2}" 2>&1 || true
            echo '```'
            echo ""
          }
          {
            report "Outdated packages (stable)" --outdated
            report "Outdated packages (including prerelease)" --outdated --include-prerelease
            report "Vulnerable packages" --vulnerable
            report "Deprecated packages" --deprecated
          } >> "$GITHUB_STEP_SUMMARY"
