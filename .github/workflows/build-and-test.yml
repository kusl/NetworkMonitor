# GitHub Actions Workflow: Build and Test
# Triggers on every push and pull request to any branch
# Builds and tests on all major platforms

name: Build and Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

# Don't pile up redundant runs for the same ref; cancel superseded ones.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          # .NET 10 is GA, so pin to the stable channel (no preview quality).
          dotnet-version: '10.0.x'

      - name: Display .NET info
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore src/NetworkMonitor.slnx

      - name: Build solution
        run: dotnet build src/NetworkMonitor.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test src/NetworkMonitor.slnx --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: '**/test-results.trx'
          if-no-files-found: warn
          retention-days: 30
